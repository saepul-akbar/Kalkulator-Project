<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Project</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-logo">Neumorph Calculator</div>
    </header>
    <main class="calc-page">
        <div class="calc-card">
            <div class="calc-display">
                <div id="history-display"></div>
                <div id="main-display">0</div>
            </div>
            <div class="calc-buttons">
                <!-- Row 1 -->
                <button class="calc-button calc-button--clear">C</button>
                <button class="calc-button calc-button--delete">DEL</button>
                <button class="calc-button calc-button--operator">÷</button>
                <button class="calc-button calc-button--operator">×</button>
                <!-- Row 2 -->
                <button class="calc-button">7</button>
                <button class="calc-button">8</button>
                <button class="calc-button">9</button>
                <button class="calc-button calc-button--operator">-</button>
                <!-- Row 3 -->
                <button class="calc-button">4</button>
                <button class="calc-button">5</button>
                <button class="calc-button">6</button>
                <button class="calc-button calc-button--operator">+</button>
                <!-- Row 4 -->
                <button class="calc-button">1</button>
                <button class="calc-button">2</button>
                <button class="calc-button">3</button>
                <button class="calc-button calc-button--equal">=</button>
                <!-- Row 5 -->
                <button class="calc-button span-2">0</button>
                <button class="calc-button">.</button>
            </div>
        </div>
    </main>
    <Footer>
        <div class="footer-logo">Neumorph Calculator</div>
        <div class="footer-copy">@ 2026 NeumorphCalc By Saepul Akbar</div>
    </Footer>
    <script src="js/script.js"></script>
</body>
</html>
